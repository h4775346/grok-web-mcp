  <text x="480" y="40" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">No xAI API key. Jobs run in the grok.com tab you are already logged into.</text>
  <text x="480" y="215" font-size="13" fill="#8b949e" text-anchor="middle">Nothing leaves your machine except what your own browser already sends to grok.com.</text>
